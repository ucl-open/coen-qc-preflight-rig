[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "coen-qc-preflight-rig"
description = "The pre-training preflight: one workflow for each rig kind, checking every device the rig's rig.yml declares."
license = "MIT"
requires-python = ">=3.11, <3.12"
version = "0.1.0"
dependencies = [
  "open-rigs",
  "pyyaml",
]

[project.scripts]
coen-qc-preflight-rig = "coen_qc_preflight_rig.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "7c7c0c37499cf9054d6156830e5d9cfb02445dbe"}

[tool.ruff]
line-length = 120
target-version = "py311"
