[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "coen-qc-preflight-rig"
description = "The pre-training preflight: one workflow for every rig, its checks chosen from the rig's rig.yml."
license = "MIT"
requires-python = ">=3.11, <3.12"
version = "0.1.0"
dependencies = [
  "swc-aeon>=0.2.0",
  "open-rigs",
  "pyyaml",
]

[project.scripts]
coen-qc-preflight-rig = "coen_qc_preflight_rig.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "f48217a3145ae84abe15612eca0c81c2be95418a"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }

[tool.ruff]
line-length = 120
target-version = "py311"
