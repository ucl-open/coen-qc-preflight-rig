# yaml-language-server: $schema=https://raw.githubusercontent.com/Coen-Lab/lib-open-rigs/main/src/open_rigs/schemas/lab_rig.json
# GREEN-DOME-1, in the lab rig model (lib-open-rigs open_rigs.rigs.lab_rig, laid out as its rig-template.yml).
# Values from production's RigConfigs.cs and main.bonsai (ActiveExperiments) and rig-setup's 4 Nov 2026
# hardware scan. On the rig this file is C:\Coen-Lab-Local\RigConfigs\GREEN-DOME-1\rig.yml; calibration
# artefacts (valve curves and the like) go in calibration\ beside it, referenced by paths relative to it.
#
rootPath: C:\Coen-Lab-Local\Acquired-Data
rigId: G1                 # two capitals or a capital and a digit: app-rig-control's session numbering (G for green)

# Each kind of device is a group of named entries: behaviorBoard: main: is BehaviorBoard-Main in the
# data and in live view. The workflow takes each device it drives by that name and stops at startup,
# naming what this file has, if one is missing. usbSerial is the board's USB serial, an FTDI chip's
# or a Pico's flash id (app-rig-setup's hardware scan lists each port's): RecordHarpDevices checks at
# Start that the board on each portName has it, for every Harp board here, and stops the workflow
# saying which board is where if not.
behaviorBoard:
  main:
    portName: COM6
    usbSerial: BG01WA0E
    pulseController:
      outputPulseEnable: "DO1, DO2"   # never DO3: the ZapitTrigger line is held until the workflow clears it
      # Each line is a FixedPulse (width set here) or a CalibratedPulse (width looked up per reward
      # on a valve calibration curve in calibration\). A fixed reward line delivers ceil(ul / 2)
      # pulses of its width, assuming 2 ul per pulse; a calibrated one delivers the requested volume.
      outputs:
        DO1: { discriminatorType: CalibratedPulse, artefact: calibration/RewardValve-Left.json }   # left reward valve
        DO2: { discriminatorType: CalibratedPulse, artefact: calibration/RewardValve-Right.json }   # right reward valve
        DO3: { discriminatorType: FixedPulse, pulseWidthMs: 0 }   # ZapitTrigger line: held, not pulsed, so no width
    # What each line drives (lab rig model): one RewardValve per spout, named left and right, and the ZapitTrigger.
    wiring:
      DIPort0: { device: Photodiode }
      DO0: { device: CameraTrigger, targets: [Camera-Face, Camera-Pupil, Camera-Body] }
      DO1: { device: RewardValve, name: left }
      DO2: { device: RewardValve, name: right }
      DO3: { device: ZapitTrigger }
    cameraTriggerController:
      trigger0Enabled: true     # camera trigger 0 shares the DO0 pin
      trigger0Frequency: 50     # Hz
      trigger1Enabled: false    # camera trigger 1 shares the DO1 pin, which drives the left valve; off means nothing is written to it
      trigger1Frequency: 50     # Hz, used only if trigger 1 is enabled
    runningWheel:
      wheelDiameterMm: 75
      countsPerRev: 4096

timestampGeneratorGen3:
  main:
    portName: COM3
    usbSerial: AQ03WH45
    timerFrequency: Timer1000Hz

# The lick spout stage's two Harp StepperDriver boards. wiring: names what each motor and input
# is connected to.
# stepInterval, microstepResolution and maximumRunCurrent are the values av-dome writes.
stepperDriver:
  a:
    portName: COM4
    usbSerial: AQ03WRBG
    stepInterval: 280
    microstepResolution: Microstep8
    maximumRunCurrent: 0.5
    wiring:
      Motor0: { device: BaseTransverse }
      Motor1: { device: Radial, side: left }
      Motor2: { device: Radial, side: right }
      Input0: { device: BaseTransverseHome }
      Input1: { device: RadialHome, side: left }
      Input2: { device: RadialHome, side: right }
  b:
    portName: COM5
    usbSerial: AQ03WW0D
    stepInterval: 280
    microstepResolution: Microstep8
    maximumRunCurrent: 0.5
    wiring:
      Motor0: { device: Elevation, side: left }
      Motor1: { device: Elevation, side: right }
      Input0: { device: ElevationHome, side: left }
      Input1: { device: ElevationHome, side: right }

licketySplit:
  left:
    portName: COM8
    usbSerial: E664C856C360B937
  right:
    portName: COM7
    usbSerial: E664C856C31F4637

camera:
  face:
    serialNumber: "23100954"
    exposureUs: 19000    # microseconds
    gainDb: 0
    binning: 1
    pixelFormat: Mono8     # stated: left out, a camera keeps the format stored on it
  pupil:
    serialNumber: "23201536"
    exposureUs: 19000    # microseconds
    gainDb: 0
    binning: 1
    pixelFormat: Mono8     # stated: left out, a camera keeps the format stored on it
  body:
    serialNumber: "23199184"
    exposureUs: 19000    # microseconds
    gainDb: 0
    binning: 1
    pixelFormat: Mono8     # stated: left out, a camera keeps the format stored on it

projector:
  meshPath: calibration/Projector-Mesh.csv
  gammaPath: calibration/Projector-Gamma.bmp

speakerArray:
  device:
    deviceName: Speakers (XMOS xCORE-200 MC (UAC2.0))
    hostApi: Windows WDM-KS
    sampleRate: 48000       # Hz
    channelCount: 32
    suggestedLatency: 0.002 # s
    bootDelaySeconds: 3.0   # s before the mixer starts: a fault while the sound card boots can blue-screen the PC
  syncChannel: 31           # carries a copy of each stimulus for alignment with acquisition
  syncGain: 0.2
  penaltySoundChannel: 2    # the penalty sound's channel (the centre speaker, as GREEN-DOME-2's)
  unusedChannels: [30]      # not connected
  penaltySound: ../shared/sounds/penalty_tone.wav
  backgroundNoise: ../shared/sounds/background_noise.wav   # the lab's one background noise (RigConfigs\shared, kept from the server's config\shared)
  # Speakers currently wired on this rig. Position is relative to the subject:
  # azimuth 0 = straight ahead, positive to the right; elevation 0 = horizontal.
  # filter: the speaker's SpeakerFilter artefact (FIR taps), relative to this directory.
  speakers:
    left:
      position: { azimuth: -90, elevation: 15 }
      channel: 0
      filter: calibration/speaker-left.json
    right:
      position: { azimuth: 90, elevation: 15 }
      channel: 1
      filter: calibration/speaker-right.json
    centre:
      position: { azimuth: 0, elevation: 15 }
      channel: 2
      filter: calibration/speaker-centre.json
  # Full 25-speaker dome layout, transcribed from the legacy SpeakerCalibration map in
  # TrialTypeInitialise.cs. Channel numbers below are the legacy 1-based speaker IDs and MUST be
  # re-checked against the actual mixer wiring before use. Enable per rig once the speakers are wired.
  #   layer1_0:      { position: { azimuth: 0,      elevation: 75 },  channel: 1 }
  #   layer1_90:     { position: { azimuth: 90,     elevation: 75 },  channel: 2 }
  #   layer1_-90:    { position: { azimuth: -90,    elevation: 75 },  channel: 3 }
  #   layer2_22:     { position: { azimuth: 22.5,   elevation: 45 },  channel: 4 }
  #   layer2_67:     { position: { azimuth: 67.5,   elevation: 45 },  channel: 5 }
  #   layer2_112:    { position: { azimuth: 112.5,  elevation: 45 },  channel: 6 }
  #   layer2_-22:    { position: { azimuth: -22.5,  elevation: 45 },  channel: 7 }
  #   layer2_-67:    { position: { azimuth: -67.5,  elevation: 45 },  channel: 8 }
  #   layer2_-112:   { position: { azimuth: -112.5, elevation: 45 },  channel: 9 }
  #   layer3_30:     { position: { azimuth: 30,     elevation: 15 },  channel: 10 }
  #   layer3_60:     { position: { azimuth: 60,     elevation: 15 },  channel: 11 }
  #   layer3_90:     { position: { azimuth: 90,     elevation: 15 },  channel: 12 }
  #   layer3_120:    { position: { azimuth: 120,    elevation: 15 },  channel: 13 }
  #   layer3_-30:    { position: { azimuth: -30,    elevation: 15 },  channel: 14 }
  #   layer3_-60:    { position: { azimuth: -60,    elevation: 15 },  channel: 15 }
  #   layer3_-90:    { position: { azimuth: -90,    elevation: 15 },  channel: 16 }
  #   layer3_-120:   { position: { azimuth: -120,   elevation: 15 },  channel: 17 }
  #   layer4_30:     { position: { azimuth: 30,     elevation: -15 }, channel: 18 }
  #   layer4_60:     { position: { azimuth: 60,     elevation: -15 }, channel: 19 }
  #   layer4_90:     { position: { azimuth: 90,     elevation: -15 }, channel: 20 }
  #   layer4_120:    { position: { azimuth: 120,    elevation: -15 }, channel: 21 }
  #   layer4_-30:    { position: { azimuth: -30,    elevation: -15 }, channel: 22 }
  #   layer4_-60:    { position: { azimuth: -60,    elevation: -15 }, channel: 23 }
  #   layer4_-90:    { position: { azimuth: -90,    elevation: -15 }, channel: 24 }
  #   layer4_-120:   { position: { azimuth: -120,   elevation: -15 }, channel: 25 }

# Zapit optogenetics server (tcpServer section of the Zapit settings file). Contacted only when the
# task has optogenetics on, so a rig without it can leave the defaults.
zapit:
  host: 127.0.0.1         # PC running Zapit; 127.0.0.1 when Zapit runs on this rig PC
  port: 1488
  hardwareTriggered: false  # true once wiring's ZapitTrigger line is cabled to the Zapit DAQ trigger input
# Default absolute stage position at session start (steps)
lickSpoutDefaultPosition:   # mean of the two-spout mice on this rig
  baseTransverse: 6150
  radialLeft: 10100
  radialRight: 10300
  elevationLeft: 10900
  elevationRight: 13400

# Every camera's video is encoded on the NVIDIA GPU (RTX 5060).
videoEncoder:
  codec: h264_nvenc
