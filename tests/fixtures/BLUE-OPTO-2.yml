# yaml-language-server: $schema=https://raw.githubusercontent.com/ucl-open/av-dome/pip/main-switchover/src/DataSchemas/ucl_open_av_dome.json
# BLUE-OPTO-2, rewritten 7 Nov 2026 from its flat (pre-switchover) rig.yml into the keyed layout of
# config\rig-template.yml (pip/main-switchover). Same values; usbSerials from rig-setup's 2 Nov 2026
# hardware scan. Old file: _backups\BLUE-OPTO-2_rig_2026-11-07T13-22-00_before-keyed-layout.yml.
# Production (ActiveExperiments) does not read this file.
#
# Each kind of device is a group of named entries: behaviorBoard: main: is BehaviorBoard-Main in the
# data and in live view. The full 25-speaker dome layout is in config\rig-template.yml.
rootPath: C:\Coen-Lab-Local\Acquired-Data

behaviorBoard:
  main:
    portName: COM11
    usbSerial: BG00O1OC
    pulseController:
      outputPulseEnable: "DO1, DO2, DO3"
      # Each reward valve is a CalibratedPulse: its curve, in calibration\ beside this file, plans every
      # reward's pulses at the gap it was calibrated at. The ZapitTrigger line (DO3) is held high, never pulsed:
      # the board model needs a DO3 entry, so it is the dome template's 0 ms FixedPulse.
      outputs:
        DO1: { discriminatorType: CalibratedPulse, artefact: calibration/valve-DO1.json }
        DO2: { discriminatorType: CalibratedPulse, artefact: calibration/valve-DO2.json }
        DO3: { discriminatorType: FixedPulse, pulseWidthMs: 0 }
    # What each line drives (dome rig model, open_rigs.rigs.dome): one RewardValve per side and one ZapitTrigger.
    wiring:
      DO0: { device: CameraTrigger, targets: [Camera-Face, Camera-Pupil, Camera-Body] }
      DO1: { device: RewardValve, side: left }
      DO2: { device: RewardValve, side: right }
      DO3: { device: ZapitTrigger, note: also the masking light }
    cameraTriggerController:
      trigger0Enabled: true     # camera trigger 0 shares the DO0 pin
      trigger0Frequency: 50     # Hz
      trigger1Enabled: false    # camera trigger 1 shares the DO1 pin, which drives the left valve
      trigger1Frequency: 50     # Hz, used only if trigger 1 is enabled
    runningWheel:
      wheelDiameterMm: 170
      countsPerRev: 4096

timestampGeneratorGen3:
  main:
    portName: COM16
    usbSerial: AQ03WH43
    timerFrequency: Timer1000Hz

# Board a motor 0 base transverse (1), motor 1 left radial (2), motor 2 right radial (3);
# board b motor 0 left elevation (4), motor 1 right elevation (5).
stepperDriver:
  a:
    portName: COM14       # motors 1, 2, 3
    usbSerial: AQ03WRVN
  b:
    portName: COM12       # motors 4, 5
    usbSerial: AQ03WRC1

# Both Lickety Splits were unplugged at the 2 Nov scan: these usbSerials are what Windows last saw
# on COM15 and COM13. Check them against the next scan.
licketySplit:
  left:
    portName: COM15
    usbSerial: E664C856C3769D22
    channel0TriggerThreshold: 0     # ADC counts above which a lick registers
    channel0UntriggerThreshold: 0   # ADC counts below which the lick ends
  right:
    portName: COM13
    usbSerial: E664C856C3658322
    channel0TriggerThreshold: 0
    channel0UntriggerThreshold: 0

camera:
  face:
    serialNumber: "25366326"
    exposureTime: 19000    # microseconds
    gain: 0
    binning: 1
  pupil:
    serialNumber: "25366328"
    exposureTime: 19000    # microseconds
    gain: 0
    binning: 1
  body:
    serialNumber: "25366318"
    exposureTime: 19000    # microseconds
    gain: 0
    binning: 1

# Production's files, read only; copy them to calibration\ beside this file when the rig switches over.
projectionCalibration:
  meshMapPath: C:\RigConfigs\MeshMap.csv
  gammaLutPath: C:\RigConfigs\gammalut.bmp

speakerArray:
  device:
    deviceName: Speakers (XMOS xCORE-200 MC (UAC2.0))
    hostApi: Windows WDM-KS
    sampleRate: 48000       # Hz
    channelCount: 32
    suggestedLatency: 0.002 # s
    bootDelay: 3.0          # s; guards a driver fault if the workflow stops during mixer init
  syncChannel: 31           # carries a copy of each stimulus for alignment with acquisition
  syncGain: 0.2
  errorSoundChannel: 2      # the error sound's channel
  unusedChannels: [30]      # not connected
  # Position is relative to the subject: azimuth 0 = straight ahead, positive to the right.
  speakers:
    left:
      position: { azimuth: -90, elevation: 15 }
      channel: 0
    right:
      position: { azimuth: 90, elevation: 15 }
      channel: 1
    centre:
      position: { azimuth: 0, elevation: 15 }
      channel: 2

zapit:
  host: 127.0.0.1
  port: 1488
  hardwareTriggered: true

# Default absolute stage position at session start (steps)
lickSpoutDefaultPosition:
  baseTransverse: 0       # motor 1
  leftRadial: 0           # motor 2
  rightRadial: 0          # motor 3
  leftElevation: 0        # motor 4
  rightElevation: 0       # motor 5
