# yaml-language-server: $schema=https://raw.githubusercontent.com/Coen-Lab/lib-open-rigs/main/src/open_rigs/schemas/lab_rig.json
# BLUE-OPTO-2, in the lab rig model (lib-open-rigs open_rigs.rigs.lab_rig, laid out as its rig-template.yml).
# Production (ActiveExperiments) does not read this file.
rootPath: C:\Coen-Lab-Local\Acquired-Data
rigId: B2                 # app-rig-control's session numbering (B for blue)

behaviorBoard:
  main:
    portName: COM11
    usbSerial: BG00O1OC
    pulseController:
      outputPulseEnable: "DO1, DO2"   # never DO3: the ZapitTrigger line is held until the workflow clears it
      outputs:
        DO1: { discriminatorType: CalibratedPulse, artefact: calibration/RewardValve-Left.json }
        DO2: { discriminatorType: CalibratedPulse, artefact: calibration/RewardValve-Right.json }
        DO3: { discriminatorType: FixedPulse, pulseWidthMs: 0 }   # ZapitTrigger line: held, not pulsed, so no width
    # What each line drives: one RewardValve per spout, named left and right, and one ZapitTrigger (lab rig model).
    wiring:
      DIPort0: { device: Photodiode }
      DO0: { device: CameraTrigger, targets: [Camera-Face, Camera-Pupil, Camera-Body] }
      DO1: { device: RewardValve, name: left }
      DO2: { device: RewardValve, name: right }
      DO3: { device: ZapitTrigger, note: also the masking light }
    cameraTriggerController:
      trigger0Enabled: true     # camera trigger 0 shares the DO0 pin
      trigger0Frequency: 50     # Hz
      trigger1Enabled: false    # camera trigger 1 shares the DO1 pin, which drives the left valve
      trigger1Frequency: 50     # Hz, used only if trigger 1 is enabled
    runningWheel:
      wheelDiameterMm: 75
      countsPerRev: 4096

timestampGeneratorGen3:
  main:
    portName: COM16
    usbSerial: AQ03WH43
    timerFrequency: Timer1000Hz

# The lick spout stage's two Harp StepperDriver boards. wiring: names what each motor and input
# is connected to.
# stepInterval, microstepResolution and maximumRunCurrent are the values av-dome writes.
stepperDriver:
  a:
    portName: COM14
    usbSerial: AQ03WRVN
    stepInterval: 280
    microstepResolution: Microstep8
    maximumRunCurrent: 0.5
    wiring:
      Motor0: { device: BaseTransverse }
      Motor1: { device: Radial, side: left }
      Motor2: { device: Radial, side: right }
      Input0: { device: BaseTransverseHome }
      Input1: { device: RadialHome, side: left }
      Input2: { device: RadialHome, side: right }
  b:
    portName: COM12
    usbSerial: AQ03WRC1
    stepInterval: 280
    microstepResolution: Microstep8
    maximumRunCurrent: 0.5
    wiring:
      Motor0: { device: Elevation, side: left }
      Motor1: { device: Elevation, side: right }
      Input0: { device: ElevationHome, side: left }
      Input1: { device: ElevationHome, side: right }

# Both Lickety Splits were unplugged at the 2 Nov scan: these usbSerials are what Windows last saw
# on COM15 and COM13. Check them against the next scan.
licketySplit:
  left:
    portName: COM15
    usbSerial: E664C856C3769D22
    channel0TriggerThreshold: 0     # ADC counts above which a lick registers
    channel0UntriggerThreshold: 0   # ADC counts below which the lick ends
  right:
    portName: COM13
    usbSerial: E664C856C3658322
    channel0TriggerThreshold: 0
    channel0UntriggerThreshold: 0

camera:
  face:
    serialNumber: "25366326"
    exposureUs: 19000    # microseconds
    gainDb: 0
    binning: 1
    pixelFormat: Mono8     # stated: left out, a camera keeps the format stored on it
  pupil:
    serialNumber: "25366328"
    exposureUs: 19000    # microseconds
    gainDb: 0
    binning: 1
    pixelFormat: Mono8     # stated: left out, a camera keeps the format stored on it
  body:
    serialNumber: "25366318"
    exposureUs: 19000    # microseconds
    gainDb: 0
    binning: 1
    pixelFormat: Mono8     # stated: left out, a camera keeps the format stored on it

# Every camera's video is encoded on the NVIDIA GPU (RTX 5060).
videoEncoder:
  codec: h264_nvenc

# Relative to this rig's folder (lib resolves them; a full path stops the workflow at Start).
projector:
  meshPath: calibration/Projector-Mesh.csv
  gammaPath: calibration/Projector-Gamma.bmp

speakerArray:
  device:
    deviceName: Speakers (XMOS xCORE-200 MC (UAC2.0))
    hostApi: Windows WDM-KS
    sampleRate: 48000       # Hz
    channelCount: 32
    suggestedLatency: 0.002 # s
    bootDelaySeconds: 3.0   # s before the mixer starts: a fault while the sound card boots can blue-screen the PC
  syncChannel: 31           # carries a copy of each stimulus for alignment with acquisition
  syncGain: 0.2
  penaltySoundChannel: 2      # the penalty sound's channel (the centre speaker)
  unusedChannels: [30]      # not connected
  penaltySound: ../shared/sounds/penalty_tone.wav
  backgroundNoise: ../shared/sounds/background_noise.wav   # the lab's one background noise (RigConfigs\shared, kept from the server's config\shared)
  # Position is relative to the subject: azimuth 0 = straight ahead, positive to the right.
  speakers:
    left:
      position: { azimuth: -90, elevation: 15 }
      channel: 0
      filter: calibration/speaker-left.json
    right:
      position: { azimuth: 90, elevation: 15 }
      channel: 1
      filter: calibration/speaker-right.json
    centre:
      position: { azimuth: 0, elevation: 15 }
      channel: 2
      filter: calibration/speaker-centre.json

zapit:
  host: 127.0.0.1
  port: 1488
  hardwareTriggered: true

# Default absolute stage position at session start (steps)
lickSpoutDefaultPosition:   # mean of the two-spout mice on this rig
  baseTransverse: 3800
  radialLeft: 9450
  radialRight: 11650
  elevationLeft: 7900
  elevationRight: 6850
