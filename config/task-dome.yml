# The domes' preflight (src\dome.bonsai): app-rig-control launches it, with this file, on a machine whose profile is
# rig-av-dome (calibrations.toml [[preflight.by_profile]]), and writes it at Go; OpenRigs.Devices PreflightChecks reads it (ReadPreflightTask).
countSeconds: 5  # each device counted this long after Go
questions:       # asked of the person, by rig.yml kind, after the counts
  speakerArray: Did each speaker play the test sound?
  projectionCalibration: Does the test pattern fill the screen?
